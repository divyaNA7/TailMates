<div id="tailbot-button">
    🐾
</div>

<div id="tailbot-box">

    <div class="tailbot-header">

        <span>🐾 TailBot</span>

        <span id="closeTailBot">✕</span>

    </div>

    <div id="tailbot-chat">

        <div class="bot-message">

            <strong>Hi! I'm TailBot!</strong>

            <br><br>

            I can -:

            <br><br>

            Help you use TailMates

            <br>

            Explain the adoption process

            <br>

            Answer pet care questions

        </div>

    </div>

    <div class="quick-actions">

        <button class="quick-btn">
            🐾 Use TailMates
        </button>

        <button class="quick-btn">
            🏡 Adoption
        </button>

        <button class="quick-btn">
            ❤️ Pet Care
        </button>

    </div>

    <div class="tailbot-input">

        <input
        id="tailbot-input"
        placeholder="Ask TailBot..."
        >

        <button id="tailbot-send">
            ➜
        </button>

    </div>

</div>
